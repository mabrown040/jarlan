name: Accuracy Tests

on:
  # Run weekly on Monday at 9am UTC
  schedule:
    - cron: "0 9 * * 1"

  # Run on PRs that touch calculation/simulation/data code
  pull_request:
    paths:
      - "src/lib/calc/**"
      - "src/lib/sim/**"
      - "src/lib/tax/**"
      - "data/**"
      - "src/lib/__tests__/accuracy/**"

  # Manual trigger
  workflow_dispatch:

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run accuracy tests
        run: npm run test:accuracy

      - name: Generate accuracy report
        if: always()
        run: |
          npx vitest run --config vitest.accuracy.config.ts --reporter=json 2>/dev/null | node scripts/accuracy-report.mjs > accuracy-report.md || true

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-report
          path: accuracy-report.md
          retention-days: 90
